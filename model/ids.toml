# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The first row is the template's own Prism application in `app/` (TC-01).
# A capability starts with a row here; `just new-capability` writes the row,
# its scenario and its failing test in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "FR-01"
level = "build"
suite = "frame"
statement = "With a working worker, the page loads and verifies the archive only in that worker before using its identities or guest"

[[id]]
id = "CC-01"
level = "build"
suite = "chaoss"
statement = "The CHAOSS register is valid: every released metric and metrics model is numbered and counted against the release, every model names only declared metrics or its own measures, and every open claim names a declared model"

[[id]]
id = "CC-02"
level = "build"
suite = "chaoss"
statement = "The CHAOSS catalog declares every metric and metrics model of chaoss/register.json with the content digest of its pinned working-group source"

[[id]]
id = "CC-03"
level = "open"
suite = "chaoss"
statement = "A released CHAOSS item the projector cannot match to a definition is carried as an open claim, never dropped or guessed"

[[id]]
id = "CP-01"
level = "build"
suite = "compliance"
statement = "The control set the verified build emits as an OSCAL 1.1.0 component definition is accepted by the locked oscal-1.1.0-structural oracle"

[[id]]
id = "GV-01"
level = "build"
suite = "governance"
statement = "The Foundation governance register is valid: every unit, post, role, vote rule, stage, holding, membership, delegation and reference resolves; every rule that decides something belongs to a body with a quorum rule; every TOC lifecycle decision is a Technical Oversight Committee vote; every Board position the Bylaws create is held by exactly one person; and the Board's size is within the Bylaws' bounds"

[[id]]
id = "GV-02"
level = "build"
suite = "governance"
statement = "The governance catalog declares every provision of governance/register.json with the content digest of its text at the pinned source commit"

[[id]]
id = "GV-03"
level = "open"
suite = "governance"
statement = "A post, role or committee no pinned source fills, a reference that resolves to nothing, an agent with no person behind it, and every Bylaws notice is carried as an open claim, never dropped or guessed"

[[id]]
id = "GV-04"
level = "build"
suite = "governance"
statement = "Agents are Schema.org SoftwareApplication, never Person: every PROV-O actedOnBehalfOf delegation runs from a SoftwareApplication to a Person, and only a Person holds a post or a role"

[[id]]
id = "CC-04"
level = "build"
suite = "chaoss"
statement = "Every CHAOSS metric and metrics model has a complete ISO/IEC 15939 mapping: each element of its measurement information model is either stated from a CHAOSS template section cited by digest or carried as a typed open claim"

[[id]]
id = "CC-05"
level = "open"
suite = "chaoss"
statement = "An ISO/IEC 15939 element the CHAOSS templates do not carry, or a definition omits, is an open claim with its reason, never inferred from prose"

[[id]]
id = "EC-01"
level = "build"
suite = "ecosystem"
statement = "The ecosystem register is valid: every public UOR Foundation repository is numbered and counted against the snapshot, its tier and status are recorded exactly when it carries one tag of that kind, and every repository the repo-standards app does not find conformant is named by an open claim"

[[id]]
id = "EC-02"
level = "build"
suite = "ecosystem"
statement = "The ecosystem catalog declares every repository of ecosystem/register.json, the snapshot digest, and the digests of the pinned norms and decision app it was projected from"

[[id]]
id = "EC-03"
level = "open"
suite = "ecosystem"
statement = "A repository that fails a STANDARDS.md norm the repo-standards app decides, or that the app cannot decide without a tier, is carried as an open claim, never dropped or defaulted"

[[id]]
id = "SV-01"
level = "build"
suite = "views"
statement = "The stakeholder views are a valid ISO/IEC/IEEE 42010 architecture description: each stakeholder has one viewpoint governing one view, every concern is held by a declared stakeholder, framed by its viewpoint and addressed in its view, and every metrics model, decision and stakeholder is addressed or carried as an open claim"

[[id]]
id = "SV-02"
level = "build"
suite = "views"
statement = "Every stakeholder is a role its pinned source names, declared with the quote, the source commit and its digest, and an agent acts on behalf of a declared stakeholder (PROV-O actedOnBehalfOf)"

[[id]]
id = "SV-03"
level = "build"
suite = "views"
statement = "The Pages views, their Markdown twins, llms.txt and the Discord digest are generated from the stakeholder register, and a surface that differs from the register's catalog fails the gate"

[[id]]
id = "SV-04"
level = "open"
suite = "views"
statement = "A user-story role no Foundation stakeholder holds, a metrics model that states no user story, and a stakeholder no model or decision addresses are carried as open claims, never guessed"

[[id]]
id = "GL-01"
level = "build"
suite = "grimoirelab"
statement = "The GrimoireLab oracle record pins Perceval, SortingHat and the GrimoireLab release by commit and PyPI digest, binds its wrapper and corpus by digest, and declares what each oracle covers and does not cover"

[[id]]
id = "GL-02"
level = "build"
suite = "grimoirelab"
statement = "The Perceval Discord backend is added to the pinned Perceval as new files only, with unit tests and offline archive replay run by upstream's own test runner"

[[id]]
id = "GL-03"
level = "open"
suite = "grimoirelab"
statement = "Live retrieval of the Foundation's Discord waits on a read-only bot in the guild, and its token stays out of the repository"

[[id]]
id = "GL-04"
level = "build"
suite = "grimoirelab"
statement = "Each live Discord probe is an OpenTelemetry trace holding no message content or token, every trace is checked against the paging model the contribution Prism pins, and the next probes are scheduled by bounded Hebbian weights"

