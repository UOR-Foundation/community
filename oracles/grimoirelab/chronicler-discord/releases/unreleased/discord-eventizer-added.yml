---
title: Discord eventizer added
category: added
author: UOR Foundation
issue: null
notes: >
  Chronicler can turn the Discord messages fetched by
  Perceval into events: a message was sent, edited,
  replied to another one, started a thread or received
  reactions. Authors and mentioned users are given as
  identity events that keep Discord's bot flag, so the
  activity of bots can be told apart from the activity
  of people.
